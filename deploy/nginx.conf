worker_processes 1;
pid /run/order-central-gateway.pid;
error_log /var/log/order-central-gateway-error.log;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    access_log /var/log/order-central-gateway-access.log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 0.0.0.0:18000;
        server_name _;

        location = /purchase {
            return 302 /purchase/;
        }

        location /purchase/ {
            proxy_pass http://127.0.0.1:8101/;
            proxy_set_header Host $host;
        }

        location = /office {
            return 302 /office/;
        }

        location /office/ {
            proxy_pass http://127.0.0.1:8102/;
            proxy_set_header Host $host;
        }

        location ~ ^/(api|forms|tasks|task-agent|external-systems|demo|ai|voice|health|recordings|skills|task-runs|task-sessions|system-connections)(/|$) {
            proxy_pass http://127.0.0.1:18001;
            proxy_read_timeout 120s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /docs {
            proxy_pass http://127.0.0.1:18001;
            proxy_set_header Host $host;
        }

        location = /openapi.json {
            proxy_pass http://127.0.0.1:18001;
            proxy_set_header Host $host;
        }

        location / {
            root /var/www/order-central-control-current;
            try_files $uri $uri/ /index.html;
        }
    }
}
