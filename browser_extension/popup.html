<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
  <body>
    <main>
      <p id="tab-host">正在检查当前标签页…</p>
      <small id="extension-version"></small>
      <p id="capture-status" aria-live="polite">只读模式：未录制</p>
      <label id="network-option">
        <input id="capture-network" type="checkbox">
        同时观察 API（会显示浏览器调试提示）
      </label>
      <p id="capture-error" role="alert" hidden></p>
      <button id="start" type="button" disabled>开始录制</button>
      <button id="stop" type="button" disabled>停止录制</button>
    </main>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>
